<form action="{:sysuri()}" autocomplete="off" class="layui-form layui-form-pane form-search" method="get" onsubmit="return false">

    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">频道标题</label>
        <label class="layui-input-inline">
            <input class="layui-input" name="channel_title" placeholder="请输入频道标题" value="{$get.channel_title|default=''}">
        </label>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">频道名</label>
        <label class="layui-input-inline">
            <input class="layui-input" name="channel_name" placeholder="请输入频道名" value="{$get.channel_name|default=''}">
        </label>
    </div>

    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">创建时间</label>
        <div class="layui-input-inline">
            <input class="layui-input" data-date-range name="create_at" placeholder="请选择创建时间" value="{$get.create_at|default=''}">
        </div>
    </div>

    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        <button class="layui-btn layui-btn-primary" data-form-export="{:url('index')}?type={$type|default='index'}" type="button">
            <i class="layui-icon layui-icon-export"></i> 导 出
        </button>
    </div>
</form>

<script>
    require(['excel'], function (excel) {
        excel.bind(function (data) {
            // 设置表格内容
            data.forEach(function (item, index) {
                data[index] = [
                    {v: item.id, t: 'n'},
                    item.account_id || '-',
                    item.channel_id || '',
                    item.channel_title || '-',
                    item.channel_name || '-',
                    item.channel_link || ''
                ];
            });
            // 设置表头内容
            data.unshift(['监测账号', '频道ID', '频道标题', '频道名', '频道链接']);
            // 设置表格样式
            return data;
        }, '频道数据' + layui.util.toDateString(Date.now(), '_yyyyMMdd_HHmmss'));
    });
</script>
